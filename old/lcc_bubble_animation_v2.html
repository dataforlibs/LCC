const W=680,H=540;
const margin={top:68,right:28,bottom:42,left:90};
const bGroups=['Memory','Reason','Imagination'];
const xBand=d3.scaleBand().domain(bGroups).range([margin.left,W-margin.right]).padding(0.12);
const maxCount=d3.max(data,d=>d3.max(years,y=>d.counts[y]||0));
const rScale=d3.scaleSqrt().domain([0,maxCount]).range([1.5,30]);
const yScale=d3.scaleLog().domain([1,maxCount]).range([H-margin.bottom,margin.top]).clamp(true);
const color=d=>(['MERGED','DIRECT','RENAMED'].includes(d.status))?'#4A90D9':'#E8A87C';

const svg=d3.select('#sv').attr('viewBox',`0 0 ${W} ${H}`).attr('height',H);

svg.append('defs').append('clipPath').attr('id','chartClip')
  .append('rect').attr('x',margin.left-35).attr('y',margin.top-32)
  .attr('width',W-margin.left-margin.right+63).attr('height',H-margin.top-margin.bottom+32);

svg.append('g').attr('transform',`translate(${margin.left},0)`)
  .call(d3.axisLeft(yScale).ticks(5,'~s').tickSize(-(W-margin.left-margin.right)))
  .call(g=>{g.select('.domain').remove();g.selectAll('.tick line').attr('stroke','rgba(136,135,128,0.15)');g.selectAll('text').attr('font-size',10).attr('fill','var(--color-text-secondary)');});

svg.append('g').attr('transform',`translate(0,${H-margin.bottom})`)
  .call(d3.axisBottom(xBand).tickSize(0))
  .call(g=>{g.select('.domain').remove();g.selectAll('text').attr('font-size',13).attr('fill','var(--color-text-secondary)');});

const bw=xBand.bandwidth();
const jitter=new Map();
data.forEach(d=>{
  const seed=(d.code.charCodeAt(0)*31+(d.code.charCodeAt(1)||0)*17+(d.code.charCodeAt(2)||0)*7)%1000;
  jitter.set(d.code,((seed/1000)-0.5)*bw*0.55);
});

const tip=d3.select('body').append('div')
  .style('position','fixed').style('background','var(--color-background-primary)')
  .style('border','0.5px solid var(--color-border-secondary)').style('border-radius','8px')
  .style('padding','8px 12px').style('font-size','12px').style('pointer-events','none')
  .style('color','var(--color-text-primary)').style('opacity',0).style('z-index',999).style('max-width','210px');

const bubbleG=svg.append('g').attr('clip-path','url(#chartClip)');
const bubbles=bubbleG.selectAll('circle').data(data).join('circle')
  .attr('cx',d=>xBand(d.baconian)+bw/2+jitter.get(d.code))
  .attr('cy',d=>yScale(Math.max(1,d.counts[1400]||1)))
  .attr('r',d=>rScale(d.counts[1400]||0))
  .attr('fill',color).attr('opacity',0.72).attr('stroke','none').style('cursor','pointer')
  .on('mouseover',(e,d)=>{
    const yr=years[+document.getElementById('sl').value];
    tip.style('opacity',1).html(`<strong>${d.code}</strong> — ${d.label}<br><span style="color:var(--color-text-secondary)">${d.baconian} · ${d.status}</span><br>${(d.counts[yr]||0).toLocaleString()} records`);
  })
  .on('mousemove',e=>{tip.style('left',(e.clientX+14)+'px').style('top',(e.clientY-30)+'px');})
  .on('mouseout',()=>tip.style('opacity',0));

// 1815 marker line
const jeffX=xBand('Memory'); const jeffY=yScale(3);
svg.append('line').attr('x1',margin.left-8).attr('x2',W-margin.right+8)
  .attr('y1',0).attr('y2',0).attr('id','jeffLine')
  .attr('stroke','rgba(186,117,23,0.6)').attr('stroke-width',1.5).attr('stroke-dasharray','4,3');
svg.append('text').attr('id','jeffTxt').attr('x',W-margin.right+10).attr('y',4)
  .attr('font-size',10).attr('fill','#BA7517').text("← Jefferson's sale");

function setJeffLine(yi){
  if(yi>=5){svg.select('#jeffLine').attr('display','none');svg.select('#jeffTxt').attr('display','none');return;}
  svg.select('#jeffLine').attr('display',null).attr('y1',0).attr('y2',0);
  svg.select('#jeffTxt').attr('display',null);
}

function update(idx,tr=true){
  const yr=years[idx];
  document.getElementById('yr').textContent=yr;
  const sel=tr?bubbles.transition().duration(650).ease(d3.easeCubicInOut):bubbles;
  sel.attr('cy',d=>yScale(Math.max(1,d.counts[yr]||1)))
     .attr('r',d=>rScale(d.counts[yr]||0));
  setJeffLine(idx);
}

let playing=false,timer=null;
document.getElementById('sl').addEventListener('input',function(){update(+this.value,false);});
document.getElementById('pb').addEventListener('click',function(){
  if(playing){clearInterval(timer);playing=false;this.textContent='▶ Play';return;}
  playing=true;this.textContent='⏸ Pause';
  let i=+document.getElementById('sl').value;
  if(i>=years.length-1)i=0;
  timer=setInterval(()=>{
    i++;document.getElementById('sl').value=i;update(i);
    if(i>=years.length-1){clearInterval(timer);playing=false;document.getElementById('pb').textContent='▶ Play';}
  },950);
});
update(0,false);
</script>
